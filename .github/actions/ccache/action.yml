name: Compiler cache
description: >
  Reuses compiled objects between runs. Restored everywhere, saved only from
  master, so a pull request starts from what master last built and the cache
  is not filled with one entry per push. The precompiled header needs the
  sloppiness and the compiler flag below to be cacheable at all (with GCC,
  145 of 152 units were refused without them; with them a warm Release build
  of uagent took 62 s instead of 304 s on two cores). The counts start at
  zero in every run, so `ccache --show-stats` after a build says what that
  build found.
inputs:
  name:
    description: What is built, to keep differently built objects apart.
    required: true
  save:
    description: >
      Whether a master run saves what it built. "false" for a job that builds
      part of what another job with the same name builds whole.
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          brew install --quiet ccache
          flags="-Xclang -fno-pch-timestamp"
        else
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          flags="-fpch-preprocess"
        fi
        {
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_MAXSIZE=400M"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CXXFLAGS=$flags"
        } >> "$GITHUB_ENV"
    - if: github.ref == 'refs/heads/master' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-
    - if: github.ref != 'refs/heads/master' || inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: ccache --zero-stats
