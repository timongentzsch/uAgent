name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            arch: x86_64
            build_type: Debug
          - runner: ubuntu-24.04
            target: linux-x86_64
            arch: x86_64
            build_type: Release
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
            build_type: Debug
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
            build_type: Release
          - runner: macos-15
            target: macos-arm64
            arch: arm64
            build_type: Debug
          - runner: macos-15
            target: macos-arm64
            arch: arm64
            build_type: Release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DUAGENT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check generated skill references
        if: matrix.build_type == 'Release'
        run: |
          set -euo pipefail
          generated=$(mktemp -d)
          ./build/uagent --emit-reference "$generated"
          if ! diff -ru skills/uagent-config/references "$generated" \
              --exclude=self-configuration.md; then
            echo '::error::generated references are stale; run' \
              'uagent --emit-reference skills/uagent-config/references'
            exit 1
          fi
      - name: Package
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(uagent VERSION ([^ ]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version v$version" >&2
            exit 1
          fi
          package_root="$RUNNER_TEMP/package"
          prefix="$package_root/uagent-$version"
          UAGENT_BUILD_DIR="$PWD/build" UAGENT_PREFIX="$prefix" ./install.sh
          "$prefix/bin/uagent" --version
          mkdir -p dist
          archive="uagent-$version-${{ matrix.target }}.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$package_root" -czf "dist/$archive" "uagent-$version"
          python3 tests/package_contents.py "dist/$archive"
          (cd dist && cmake -E sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.build_type == 'Release'
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Instrumented startup and rendering cost several times the plain build, so
    # the terminal tests get proportionally longer deadlines here.
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure ASan and UBSan
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel
      - name: Test
        run: ctest --preset sanitize

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure TSan
        run: cmake --preset tsan
      - name: Build core tests
        run: cmake --build --preset tsan --target uagent_tests --parallel
      - name: Test concurrent core paths
        run: ctest --preset tsan -R '^core$'

  fuzzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - name: Configure fuzzers
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset fuzz
      - name: Build fuzzers
        run: |
          cmake --build --preset fuzz --target \
            uagent_fuzz_sse uagent_fuzz_input_decoder --parallel
      - name: Smoke fuzz
        run: |
          build/fuzz/uagent_fuzz_sse -runs=1000 -max_len=8192
          build/fuzz/uagent_fuzz_input_decoder -runs=2000 -max_len=4096

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcovr libcurl4-openssl-dev
      - name: Configure coverage
        run: cmake --preset coverage
      - name: Build and test
        run: |
          cmake --build --preset coverage --target uagent_tests --parallel
          ctest --preset coverage -R '^core$'
      - name: Generate branch report
        run: >-
          gcovr --root .
          --filter include --filter src
          --exclude third_party
          --branches
          --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          --xml-pretty
          --xml build/coverage/coverage.xml
          --html-details build/coverage/coverage.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html
            build/coverage/coverage.*.html
          if-no-files-found: error
          retention-days: 7

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv run --frozen ruff check tests benchmarks
      - run: uv run --frozen ruff format --check tests benchmarks
      - name: Check the slop checks against their fixtures
        run: uv run --frozen python benchmarks/slopscan.py --self-test
      - name: Check the session failure join against its fixtures
        run: uv run --frozen python benchmarks/session_metrics.py --self-test
      - name: Scan the tree for slop
        run: uv run --frozen python benchmarks/slopscan.py

  cpp-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Check formatting
        run: >-
          uvx --from clang-format==22.1.8 clang-format
          --dry-run --Werror include/*.h include/*/*.h src/*.cc src/*/*.cc
          tests/unit/*.h tests/unit/*.cc tests/fuzz/*.cc benchmarks/*.cc
      - name: Check Google style
        run: >-
          uvx --from cpplint==2.0.2 cpplint
          --recursive --exclude=third_party --exclude=tests/fixtures
          --extensions=h,cc
          --filter=-build/c++17,-build/header_guard,-whitespace/indent_namespace,-readability/check
          include src tests benchmarks
      - name: Configure clang-tidy
        run: cmake --preset tidy
      - name: Check C++ semantics and naming
        run: >-
          uvx --from clang-tidy==22.1.8 run-clang-tidy.py
          -p build/tidy
          -header-filter='.*/(include|src|tests|benchmarks)/.*'

  release:
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [build-and-test, sanitizers, thread-sanitizer, fuzzers, coverage, python, cpp-style]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create deterministic SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          ((${#archives[@]})) || {
            echo "no release archives found" >&2
            exit 1
          }
          (
            cd dist
            while IFS= read -r archive; do
              sha256sum "$archive"
            done < <(printf '%s\n' "${archives[@]#dist/}" | LC_ALL=C sort)
          ) > dist/SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keylessly sign SHA-256 manifest
        shell: bash
        run: >-
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json
          dist/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
