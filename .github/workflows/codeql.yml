name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Private repositories need GitHub Advanced Security for CodeQL uploads.
    if: github.event.repository.private == false
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: c-cpp
          build-mode: manual
          # The trap cache crowds the compiler caches out of the cache quota.
          trap-caching: false
      - uses: ./.github/actions/native-setup
      # Analyze the native host without building the browser bundle.
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
          -DUAGENT_EMBED_WEB=OFF -DUAGENT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:c-cpp"
