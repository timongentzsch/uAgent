name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            arch: x86_64
            build_type: Debug
          - runner: ubuntu-24.04
            target: linux-x86_64
            arch: x86_64
            build_type: Release
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
            build_type: Debug
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
            build_type: Release
          - runner: macos-15
            target: macos-arm64
            arch: arm64
            build_type: Debug
          - runner: macos-15
            target: macos-arm64
            arch: arm64
            build_type: Release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libedit-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DUAGENT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(uagent VERSION ([^ ]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version v$version" >&2
            exit 1
          fi
          package_root="$RUNNER_TEMP/package"
          prefix="$package_root/uagent-$version"
          UAGENT_BUILD_DIR="$PWD/build" UAGENT_PREFIX="$prefix" ./install.sh
          "$prefix/bin/uagent" --version
          mkdir -p dist
          archive="uagent-$version-${{ matrix.target }}.tar.gz"
          tar -C "$package_root" -czf "dist/$archive" "uagent-$version"
          (cd dist && cmake -E sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.build_type == 'Release'
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libedit-dev
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DUAGENT_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libedit-dev
      - name: Configure TSan
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DUAGENT_WARNINGS_AS_ERRORS=ON
          -DUAGENT_ENABLE_TSAN=ON
      - name: Build core tests
        run: cmake --build build --target uagent_tests --parallel
      - name: Test concurrent core paths
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build -R '^core$' --output-on-failure

  fuzzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libedit-dev
      - name: Configure fuzzers
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DUAGENT_WARNINGS_AS_ERRORS=ON
          -DUAGENT_BUILD_FUZZERS=ON
      - name: Build fuzzers
        run: cmake --build build --target uagent_fuzz_sse uagent_fuzz_openai_stream --parallel
      - name: Smoke fuzz
        run: |
          build/uagent_fuzz_sse -runs=1000 -max_len=8192
          build/uagent_fuzz_openai_stream -runs=1000 -max_len=8192

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcovr libcurl4-openssl-dev libedit-dev
      - name: Configure coverage
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DUAGENT_WARNINGS_AS_ERRORS=ON
          -DUAGENT_ENABLE_COVERAGE=ON
      - name: Build and test
        run: |
          cmake --build build --target uagent_tests --parallel
          ctest --test-dir build -R '^core$' --output-on-failure
      - name: Generate branch report
        run: >-
          gcovr --root .
          --filter include --filter src
          --exclude third_party
          --branches
          --xml-pretty build/coverage.xml
          --html-details build/coverage.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            build/coverage.xml
            build/coverage.html
            build/coverage.*.html
          if-no-files-found: error
          retention-days: 7

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv run --frozen ruff check tests
      - run: uv run --frozen ruff format --check tests

  cpp-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libedit-dev
      - name: Check formatting
        run: >-
          uvx --from clang-format==22.1.8 clang-format
          --dry-run --Werror include/*.h include/*/*.h src/*.cc src/*/*.cc
          tests/unit/*.h tests/unit/*.cc tests/fuzz/*.cc benchmarks/*.cc
      - name: Check Google style
        run: >-
          uvx --from cpplint==2.0.2 cpplint
          --recursive --exclude=third_party --extensions=h,cc
          --filter=-build/c++17,-build/header_guard,-whitespace/indent_namespace,-readability/check
          include src tests benchmarks
      - name: Configure clang-tidy
        run: >-
          cmake -S . -B build-style
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DUAGENT_BUILD_BENCHMARKS=ON
      - name: Check C++ semantics and naming
        run: >-
          uvx --from clang-tidy==22.1.8 run-clang-tidy.py
          -p build-style
          -header-filter='.*/(include|src|tests|benchmarks)/.*'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, sanitizers, thread-sanitizer, fuzzers, coverage, python, cpp-style]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
