name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Private repositories need GitHub Advanced Security for CodeQL uploads.
    # Skip before runner allocation on plans where this repository is private;
    # the gate resumes automatically if it becomes public again.
    if: github.event.repository.private == false
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/changes.py
      - name: Initialize CodeQL
        if: steps.changes.outputs.native == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
      - name: Install dependencies
        if: steps.changes.outputs.native == 'true'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      # CodeQL reads the compiler invocations, not the binary, so an unoptimised
      # build without the release link-time optimisation is enough.
      - name: Configure
        if: steps.changes.outputs.native == 'true'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DUAGENT_WARNINGS_AS_ERRORS=ON
      - name: Build
        if: steps.changes.outputs.native == 'true'
        run: cmake --build build --parallel 4
      - name: Analyze
        if: steps.changes.outputs.native == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:c-cpp"
