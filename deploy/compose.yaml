services:
  uagent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - seccomp:./seccomp-chrome.json
    ports:
      - "127.0.0.1:${UAGENT_WEB_PORT:-8080}:${UAGENT_WEB_PORT:-8080}"
    environment:
      UAGENT_WEB_PORT: ${UAGENT_WEB_PORT:-8080}
    volumes:
      - uagent-data:/data
      - ${UAGENT_WORKSPACES:-../workspaces}:/workspaces
    env_file:
      - path: ../.env.appliance
        required: false
    shm_size: ${UAGENT_SHM_SIZE:-256m}
    tmpfs:
      - /tmp:size=${UAGENT_TMPFS_SIZE:-512m},mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:${UAGENT_WEB_PORT:-8080}/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uagent-data:
