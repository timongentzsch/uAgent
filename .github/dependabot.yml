version: 2
updates:
  # Minor and patch updates come together, once a week. A major version
  # comes on its own, so what breaks is known by name.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
    # The type definitions follow the Node version CI and the image build
    # with, not the newest one.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
