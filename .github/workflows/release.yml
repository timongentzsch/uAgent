name: Release

# A tag is pushed after its commit has passed CI on master, so the release
# promotes what that run already built and tested instead of building again.
# Every file published here comes from the master run of ci.yml for the same
# commit SHA (the release-* and web-dist artifacts, kept 7 days); the
# attestation is made over exactly those files. When the commit has no such
# run, or its artifacts expired, ci.yml is run in full for the tag instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow ci.yml --branch master --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            # Four live artifacts: three release archives and the web UI. A
            # run that skipped the native jobs or whose artifacts expired
            # does not count.
            live=$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --paginate \
              --jq '[.artifacts[] | select(.expired | not) | select(.name | test("^(release-.+|web-dist)$"))] | length' \
              | awk '{n += $1} END {print n + 0}')
            [ "$live" -ge 4 ] || run_id=
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "promoting master run: ${run_id:-none, building}"

  build:
    needs: find
    if: needs.find.outputs.run_id == ''
    uses: ./.github/workflows/ci.yml

  release:
    needs: [find, build]
    if: >-
      !cancelled() && (needs.find.outputs.run_id != '' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      # run-id is the master run when promoting, this run after a fallback build.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      # The built web UI, for source builds without Node.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ needs.find.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      # The archives are named after project(VERSION) when they were built.
      - name: Verify the archives carry the tag's version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          ((${#archives[@]})) || {
            echo "no release archives found" >&2
            exit 1
          }
          for file in dist/*; do
            [[ "${file#dist/}" == "uagent-${GITHUB_REF_NAME#v}-"* ]] || {
              echo "$file does not belong to $GITHUB_REF_NAME" >&2
              exit 1
            }
          done
      - name: Package web UI
        run: tar -C web-dist -czf "dist/uagent-web-dist-${GITHUB_REF_NAME#v}.tar.gz" .
      - name: Create deterministic SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          (
            cd dist
            while IFS= read -r archive; do
              sha256sum "$archive"
            done < <(printf '%s\n' "${archives[@]#dist/}" | LC_ALL=C sort)
          ) > dist/SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keylessly sign SHA-256 manifest
        shell: bash
        run: >-
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json
          dist/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
