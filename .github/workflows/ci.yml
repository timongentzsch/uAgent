name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  # Called by release.yml for a tag whose commit has no passing run on master.
  workflow_call:

# A newer push to a pull request replaces the run of the older one. Runs on
# master are never cancelled: each merge is tested as it landed. The workflow
# name is the caller's when called, so a release build never queues behind
# the master run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
      web: ${{ steps.select.outputs.web }}
      tidy: ${{ steps.select.outputs.tidy }}
      heavy: ${{ steps.select.outputs.heavy }}
      image: ${{ steps.select.outputs.image }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/changes.py

  # Embedded by the native builds, which are its only readers: a change to
  # the web alone is built by the web job itself.
  web-dist:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The ARM64 leg is left to master unless the change is heavy
      # (.github/changes.py).
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # The terminal cases drive a real PTY and assert on the exit status the
    # child chose. A shared runner that pauses one past its deadline gets it
    # killed instead, which reads as a wrong exit code rather than as the
    # timeout it is. Deadlines are upper bounds, so a fast leg is unaffected.
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "3"
      # These runners confine: a sandbox case that would be skipped here
      # is a failure, so the suite cannot go quiet about enforcement.
      UAGENT_TEST_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
          ccache: release
          ccache-size: 800M
      # Release archives ship Web Push (the ci-release preset). macOS links
      # Homebrew's libcrypto statically so the archive runs on hosts without
      # Homebrew.
      - name: Configure
        run: >-
          cmake --preset ci-release -B build
          ${{ runner.os == 'macOS' && '-DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 -DOPENSSL_USE_STATIC_LIBS=TRUE' || '' }}
      - name: Build
        # Bounded to the cores actually present. `--parallel` with no count
        # hands Make an unlimited `-j`, and this tree's translation units are
        # heavy enough that a smaller runner swaps instead of compiling: the
        # same build takes minutes on Linux and outlived a 20 minute budget on
        # macOS.
        run: cmake --build build --parallel 4 && ccache --show-stats
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 3 -LE source
      - name: Package
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(uagent VERSION ([^ ]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version v$version" >&2
            exit 1
          fi
          package_root="$RUNNER_TEMP/package"
          prefix="$package_root/uagent-$version"
          package_home=$(mktemp -d)
          HOME="$package_home" UAGENT_BUILD_DIR="$PWD/build" UAGENT_PREFIX="$prefix" ./install.sh
          test -z "$(ls -A "$package_home")"
          "$prefix/bin/uagent" --version
          mkdir -p dist
          archive="uagent-$version-${{ matrix.target }}.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$package_root" -czf "dist/$archive" "uagent-$version"
          python3 tests/package_contents.py "dist/$archive"
          (cd dist && cmake -E sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The feature switches compile different #if paths. Each builds on its own
  # runner instead of after the x86 leg.
  variants:
    name: variant (${{ matrix.name }})
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-only
            flags: -DUAGENT_WEB=OFF
            tests: "^(core|integration_runtime|integration_providers)$"
          - name: no-browser
            flags: -DUAGENT_BROWSER=OFF
            tests: "^core$"
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
          ccache: variant-${{ matrix.name }}
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUAGENT_WARNINGS_AS_ERRORS=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 2 -R '${{ matrix.tests }}'

  sanitizers:
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Instrumented startup and rendering cost several times the plain build, so
    # the terminal tests get proportionally longer deadlines here.
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "6"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
          ccache: sanitize
          ccache-size: 1G
      - name: Configure ASan and UBSan
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel 4 && ccache --show-stats
      - name: Test
        run: ctest --preset sanitize -j 2 -LE source
      # Session workers run with no stderr, so every process writes its
      # sanitizer report to a file (CMakePresets.json log_path).
      - name: Sanitizer reports
        if: failure()
        run: cat build/sanitize/report.* 2>/dev/null || echo "no sanitizer report"

  thread-sanitizer:
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Instrumented, and now driving real subprocesses, so the terminal cases
    # get the same proportionally longer deadlines as the other sanitizer leg.
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "6"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
          ccache: tsan
          ccache-size: 1G
      - name: Configure TSan
        run: cmake --preset tsan
      # The races worth finding are between the supervisor, its per-job I/O
      # threads and the tool reading their output -- none of which the core
      # unit binary starts. They only run under the real binary, so it has to
      # be instrumented too and the groups that drive subprocesses have to run.
      - name: Build tests and agent
        run: cmake --build --preset tsan --target uagent_tests uagent --parallel 4
      - name: Test concurrent paths
        run: ctest --preset tsan -j 2 -R '^(core|integration_(runtime|tools|web))$'
      # Session workers run with no stderr, so every process writes its
      # sanitizer report to a file (CMakePresets.json log_path).
      - name: Sanitizer reports
        if: failure()
        run: cat build/tsan/report.* 2>/dev/null || echo "no sanitizer report"

  # Not on a pull request: the same suites already run there under two
  # sanitizers and on three systems, and the floor it guards moves slowly.
  coverage:
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UAGENT_TEST_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
          ccache: coverage
          packages: gcovr
      - name: Configure coverage
        run: cmake --preset coverage
      # Most of src/app, src/ui and src/tools is only reached by driving the
      # real binary, so a core-only report measures the libraries and calls
      # the program uncovered.
      - name: Build and test
        run: |
          cmake --build --preset coverage --target uagent_tests uagent --parallel 4
          ctest --preset coverage -j 2 -R '^(core|integration_.*)$'
      # The floor sits ~2 points below the measured line rate. Measured on this
      # job's own test selection and filters, locally, with gcovr driving
      # llvm-cov gcov: 69.7%. That local number is trustworthy here because the
      # one figure real gcc/gcovr ever produced -- 57.8% from run 33103436328,
      # core tests only -- reproduces locally as 57.4% on the same selection, so
      # the two toolchains disagree by well under a point.
      - name: Generate branch report
        run: >-
          gcovr --root .
          --filter include --filter src
          --exclude third_party
          --branches
          --fail-under-line 67
          --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          --print-summary
          --xml-pretty
          --xml build/coverage/coverage.xml
          --html-details build/coverage/coverage.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html
            build/coverage/coverage.*.html
          if-no-files-found: error
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: true
      - run: .github/lint.sh
      - uses: ./.github/actions/native-setup
      - name: Source and Python contracts
        run: |
          cmake --preset debug
          ctest --preset debug -L source

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run format:check --prefix web
      - run: npm run lint --prefix web
      - run: npm run test --prefix web
      - name: Build bundle and verify notices
        run: |
          npm run build --prefix web
          npm run notices --prefix web
          npm run size --prefix web
          git diff --exit-code -- web/THIRD_PARTY_NOTICES.md
      # Only the host the browser tests drive; build-and-test already runs
      # the native suites against the same Web Push build. Configured exactly
      # as there, in the same directory, so the objects that job cached are
      # the ones asked for here: differently, every unit was compiled again.
      - uses: ./.github/actions/native-setup
        with:
          ccache: release
          ccache-save: false
          ccache-size: 800M
      - name: Build native push host
        run: |
          cmake --preset ci-release -B build
          cmake --build build --target uagent --parallel 4 && ccache --show-stats
      # Some specs read the bundle's files, .vite/manifest.json among them.
      - name: Hand the host and bundle to the browser shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-host
          path: |
            build/uagent
            web/dist
          include-hidden-files: true
          retention-days: 1
      # The browser shards run in Playwright's image for this version, which
      # carries the browsers and the system libraries they need: no download
      # from the package mirror, which stalled for minutes at a time.
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"

  web-browser:
    needs: [changes, web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.web.outputs.playwright }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-host
      - run: chmod +x build/uagent && npm ci --prefix web
      - name: Browser integration against native host
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/3
        env:
          UAGENT_TEST_BINARY: ../build/uagent
      - name: Retain browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The scan is the longest check, so its translation units are dealt round
  # robin to three runners. The generated web bundle source is not scanned.
  # A pull request that changes only translation units has those read, in
  # one job; one that changes a header, the build or the rules, and every
  # run on master, has all of them read, in three (.github/changes.py).
  clang-tidy:
    name: clang-tidy (${{ matrix.shard }}/3)
    needs: [changes, web-dist]
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.tidy != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.tidy == 'all' && '[0, 1, 2]' || '[0]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-setup
        with:
          web-dist: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Configure clang-tidy
        run: cmake --preset tidy
      - name: Check C++ semantics and naming
        env:
          UNITS: ${{ needs.changes.outputs.tidy }}
        run: |
          files=$(python3 .github/changes.py --tidy-files build/tidy "$UNITS" ${{ matrix.shard }}/3)
          test -n "$files" || exit 0
          uvx --from clang-tidy==22.1.8 run-clang-tidy.py -p build/tidy \
            -header-filter='.*/(include|src|tests|benchmarks)/.*' $files

  # The image a release publishes is otherwise first built after its tag.
  # Started under compose's seccomp profile, which can stop it starting.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker buildx build -f deploy/Dockerfile --load -t uagent-image .
      - name: Start it
        run: docker run --rm --security-opt seccomp=deploy/seccomp-chrome.json uagent-image uagent --version

  checks:
    name: CI result
    if: always()
    needs: [changes, web-dist, build-and-test, variants, sanitizers, thread-sanitizer, coverage, lint, clang-tidy, web, web-browser, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = {name: value["result"] for name, value in json.loads(os.environ["RESULTS"]).items()}
          print(json.dumps(results, indent=2))
          sys.exit(results["changes"] != "success" or any(value not in ("success", "skipped") for value in results.values()))
          PYTHON
