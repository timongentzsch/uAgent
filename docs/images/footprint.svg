  .name { font-size: 12px; }
  .value { font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { font-size: 10px; fill: #656d76; }
  .bar { fill: #b4bac1; }
  .bar.uagent { fill: #0a69da; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    text { fill: #e6edf3; }
    .note { fill: #8b949e; }
    .bar { fill: #4a525c; }
    .bar.uagent { fill: #4493f8; }
  }
</style>
