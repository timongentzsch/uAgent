name: Compiler cache
description: >
  Reuses compiled objects between runs. Restored everywhere, saved only from
  master, so a pull request starts from what master last built and the cache
  is not filled with one entry per push. For GCC on Linux: the precompiled
  header needs the two settings below to be cacheable at all (without them
  145 of 152 units were refused; with them a warm Release build of uagent
  took 62 s instead of 304 s on two cores).
inputs:
  name:
    description: What is built, to keep differently built objects apart.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ccache
        {
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_MAXSIZE=400M"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CXXFLAGS=-fpch-preprocess"
        } >> "$GITHUB_ENV"
    - if: github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.name }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.name }}-${{ runner.arch }}-
    - if: github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.name }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.name }}-${{ runner.arch }}-
