# Finding a new input takes minutes per fuzzer, so the search runs on its own
# schedule.
name: Fuzz

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fuzzer: [sse, input_decoder]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-setup
        with:
          packages: clang
      - name: Configure fuzzers
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset fuzz
      - name: Build fuzzer
        run: >-
          cmake --build --preset fuzz
          --target uagent_fuzz_${{ matrix.fuzzer }} --parallel 4
      - name: Fuzz
        run: |
          cp -r tests/fuzz/corpus/${{ matrix.fuzzer }} /tmp/corpus
          build/fuzz/uagent_fuzz_${{ matrix.fuzzer }} \
            -max_total_time=300 -print_final_stats=1 -artifact_prefix=/tmp/corpus/ /tmp/corpus
      # An artifact, not a commit: every input in tests/fuzz/corpus/ is
      # replayed by each CI smoke run, so promoting one is a human decision.
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.fuzzer }}
          path: /tmp/corpus
          if-no-files-found: error
          retention-days: 14
