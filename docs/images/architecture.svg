<text class="m" x="470" y="175">files, commands, MCP</text>
<text class="m" x="470" y="193">the agent's Chrome</text>
<text class="m" x="470" y="211">subagents</text>
<rect class="box" x="440" y="286" width="220" height="56" rx="8"/>
