name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Private repositories need GitHub Advanced Security for CodeQL uploads.
    if: github.event.repository.private == false
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          # The trap cache crowds the compiler caches out of the cache quota.
          trap-caching: false
      - uses: ./.github/actions/native-setup
      # CodeQL reads the compiler invocations, so an unoptimised build is
      # enough, and one page stands in for the web UI the host embeds.
      - name: Configure
        run: |
          mkdir -p web/dist
          echo '<!doctype html>' > web/dist/index.html
          echo index.html > web/dist/.assets
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DUAGENT_WARNINGS_AS_ERRORS=ON -DUAGENT_WEB_PUSH=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"
