name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Private repositories need GitHub Advanced Security for CodeQL uploads.
    # Skip before runner allocation on plans where this repository is private;
    # the gate resumes automatically if it becomes public again.
    if: github.event.repository.private == false
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          # The trap cache is saved from master only and took 878 MB of the
          # repository's 10 GB cache quota, which the compiler caches need.
          trap-caching: false
      - uses: ./.github/actions/native-setup
      # CodeQL reads the compiler invocations, not the binary, so an unoptimised
      # build without the release link-time optimisation is enough. The web
      # host and the browser compile only with a web UI to embed, and one page
      # serves: the analysis reads the C++, not the bundle.
      - name: Configure
        run: |
          mkdir -p web/dist
          echo '<!doctype html>' > web/dist/index.html
          echo index.html > web/dist/.assets
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DUAGENT_WARNINGS_AS_ERRORS=ON -DUAGENT_WEB_PUSH=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:c-cpp"
