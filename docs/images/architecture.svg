<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="Main-owned agent loop, providers, keys and history; paired terminal and browser clients; local browser and sandbox; authenticated SSH execution gateway shared by independent main clients, with no remote provider configuration.">
<style>
.bg { fill: #ffffff; }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1f2328; }
.t { font-weight: 600; }
.m { font-size: 11.5px; fill: #59636e; }
.c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #59636e; }
.box { fill: #f6f8fa; stroke: #d1d9e0; }
.key { fill: #ddf4ff; stroke: #0969da; }
.web { fill: #fff8c5; stroke: #d4a72c; }
.sand { fill: none; stroke: #818b98; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: #818b98; stroke-width: 1.5; }
.hd { fill: #818b98; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0d1117; }
  text { fill: #f0f6fc; }
  .m, .c { fill: #9198a1; }
  .box { fill: #151b23; stroke: #3d444d; }
  .key { fill: #0d2a4d; stroke: #4493f8; }
  .web { fill: #2e2a12; stroke: #9e7b1a; }
  .sand, .ln { stroke: #656c76; }
  .hd { fill: #656c76; }
  .lbl { stroke: #0d1117; }
}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="hd" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="bg" width="1100" height="650"/>
<rect class="sand" x="180" y="20" width="575" height="610" rx="8"/>
<text class="t" x="196" y="42">Main machine or container</text>
<rect class="box" x="20" y="65" width="140" height="60" rx="8"/>
<text class="t" x="34" y="89">Terminal</text>
<text class="c" x="34" y="108">uagent</text>
<rect class="box" x="20" y="185" width="140" height="65" rx="8"/>
<text class="t" x="34" y="210">Browser or phone</text>
<text class="m" x="34" y="230">paired client</text>
<rect class="box" x="205" y="185" width="200" height="65" rx="8"/>
<text class="t" x="220" y="210">Web host</text>
<text class="c" x="220" y="230">uagent --web</text>
<rect class="key" x="455" y="65" width="275" height="185" rx="8"/>
<text class="t" x="471" y="90">Session runtime</text>
<text class="m" x="471" y="112">one process per conversation</text>
<text x="471" y="140">Agent loop and approvals</text>
<text x="471" y="162">Providers, model keys and settings</text>
<text x="471" y="184">History, memory and accounting</text>
<text class="m" x="471" y="224">Local or remote workspace identity</text>
<path class="ln" d="M160 95H455" marker-end="url(#a)"/>
<text class="m lbl" x="300" y="87" text-anchor="middle">Unix socket</text>
<path class="ln" d="M160 217H205" marker-end="url(#a)"/>
<text class="m lbl" x="181" y="177" text-anchor="middle">HTTP / SSE</text>
<path class="ln" d="M405 217H455" marker-end="url(#a)"/>
<rect class="box" x="820" y="65" width="260" height="120" rx="8"/>
<text class="t" x="836" y="90">Model endpoint</text>
<text class="m" x="836" y="112">Chat Completions / Responses</text>
<text class="m" x="836" y="134">Anthropic Messages</text>
<text class="m" x="836" y="160">Direct from the main; local or hosted</text>
<path class="ln" d="M730 120H820" marker-end="url(#a)"/>
<text class="m lbl" x="775" y="110" text-anchor="middle">HTTPS</text>
<rect class="sand" x="455" y="310" width="275" height="90" rx="8"/>
<text class="t" x="471" y="335">Local commands and MCP</text>
<text class="m" x="471" y="357">OS sandbox: Seatbelt / Landlock</text>
<text class="m" x="471" y="379">Files use the local path policy</text>
<path class="ln" d="M590 250V310" marker-end="url(#a)"/>
<rect class="web" x="205" y="475" width="240" height="115" rx="8"/>
<text class="t" x="221" y="500">Browser service</text>
<text class="m" x="221" y="522">Chrome and Xvnc, starts on demand</text>
<text class="m" x="221" y="544">Shared signed-in profile</text>
<text class="m" x="221" y="566">Available to Local conversations</text>
<path class="ln" d="M260 250V475" marker-end="url(#a)"/>
<text class="m lbl" x="270" y="360">starts it, streams screen</text>
<path class="ln" d="M470 250H430V435H395V475" marker-end="url(#a)"/>
<text class="m lbl" x="440" y="426">drives Chrome, private socket</text>
<rect class="box" x="20" y="550" width="140" height="60" rx="8"/>
<text class="t" x="34" y="574">Script</text>
<text class="c" x="34" y="594">uagent -p --json</text>
<rect class="box" x="485" y="550" width="245" height="60" rx="8"/>
<text class="t" x="501" y="574">Headless application</text>
<text class="m" x="501" y="594">one turn, same agent/provider code</text>
<path class="ln" d="M160 610V622H610V610" marker-end="url(#a)"/>
<rect class="sand" x="800" y="265" width="280" height="365" rx="8"/>
<text class="t" x="816" y="288">Remote SSH account</text>
<rect class="key" x="820" y="315" width="240" height="125" rx="8"/>
<text class="t" x="836" y="340">Execution gateway</text>
<text class="m" x="836" y="362">One installed build, multiple mains</text>
<text class="m" x="836" y="384">Separate authenticated processes</text>
<text class="m" x="836" y="406">No provider settings or history</text>
<path class="ln" d="M730 220H780V350H820" marker-end="url(#a)"/>
<text class="m lbl" x="787" y="244" text-anchor="middle">RPC over SSH</text>
<rect class="sand" x="820" y="475" width="240" height="125" rx="8"/>
<text class="t" x="836" y="500">Remote execution</text>
<text class="m" x="836" y="522">Files and Git, sandboxed commands</text>
<text class="m" x="836" y="544">Terminals: the user's own shell</text>
<text class="m" x="836" y="566">Receipts and output are volatile</text>
<text class="m" x="836" y="588">Workspace edits persist</text>
<path class="ln" d="M940 440V475" marker-end="url(#a)"/>
</svg>
